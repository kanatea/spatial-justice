# Data paths
paths:
  raw_dir: "data/raw"
  transformed_dir: "data/transformed"
  census_input: "data/transformed/admin_boundaries_ORP.geojson"
  census_output: "data/transformed/admin_boundaries_ORP_variables.geojson"
  clustered_output: "data/processed/clusters.geojson"
  processed_dir: "data/visualizations" # Folder for the PNG

# Projection Settings
projection:
  target_epsg: 5514

# Clustering Parameters
clustering:
  n_clusters: 5
  random_state: 42

  features:
    - 'POP_DENS' #population density
    - 'PCT_WOMEN' #percent women
    - 'PCT_CHILD' #percent children
    - 'PCT_WORKING' #percent working population
    - 'PCT_ELDERLY' #percent over 64
    - 'AGEING_INDEX' #percent over 64 / under 14
    - 'DEPENDENCY' #percent over 65 and under 14 / 15-64
    - 'NATURAL_INC_RATE' # rate born - deaths
    - 'MIG_BAL_RATE' #rate difference between immigrating inside vs those leaving

visualization:
  output_filename: "cluster_map.png"
  cmap: "tab10" 
  title: "ORP Clusters based on 9 Selected Variables"

