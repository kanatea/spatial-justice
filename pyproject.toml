[project]
name = "final-project"
version = "0.1.0"
description = "Travel Accessibility (Distance/Distribution) of Emergency Care vs. Maternity Care Units"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "esda>=2.9.0",
    "geopandas>=1.1.3",
    "libpysal>=4.14.1",
    "matplotlib>=3.10.9",
    "pandas>=3.0.2",
    "pyyaml>=6.0.3",
    "splot>=1.1.7",
    "NumPy",
    "SciPy",
    "scikit-learn",
    "joblib",
    "threadpoolctl",
]

[project.scripts]
health_access = "health_access.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_access"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 88
