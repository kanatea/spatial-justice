[project]
name = "final-project"
version = "0.1.0"
description = "Travel Accessibility (Distance/Distribution) of Emergency Care vs. Maternity Care Units"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "esda",
    "geopandas",
    "libpysal>=4.14.1",
    "matplotlib>=3.10.9",
    "pandas",
    "pyyaml>=6.0.3",
    "splot>=1.1.7",
    "numpy>=2.0.0",
    "SciPy",
    "scikit-learn",
    "joblib",
    "threadpoolctl",
    "path>=17.1.1",
    "typing>=3.10.0.0",
    "typer>=0.26.7",
    "osmnx>=2.1.0",
    "pandana>=0.7",
]

[project.optional-dependencies]
notebooks = [
    "geopandas",
    "pandas",
    "numpy>=2.0.0",
    "osmnx",
    "pandana",
    "matplotlib",
    "jupyter",
    "ipykernel",
]

[project.scripts]
health_access = "health_access.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_access"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 88
